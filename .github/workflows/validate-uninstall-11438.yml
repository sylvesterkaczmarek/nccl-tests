name: Validate uninstall Docker recovery
on:
  push:
    branches: [work/prepare-nvidia-pair-137-1795]
    paths: [.github/workflows/validate-uninstall-11438.yml, secondary/**]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: helper
          persist-credentials: false
      - name: Resolve the canonical upstream base
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(gh api repos/NVIDIA/NemoClaw/git/ref/heads/main --jq '.object.sha')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "BASE_SHA=$sha" >> "$GITHUB_ENV"
          mkdir artifacts
          printf '%s\n' "$sha" > artifacts/base.txt
      - uses: actions/checkout@v4
        with:
          repository: NVIDIA/NemoClaw
          ref: ${{ steps.base.outputs.sha }}
          path: NemoClaw
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Install locked validation dependencies and build the catalogue
        run: |
          set -euo pipefail
          cd NemoClaw
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git update-ref refs/remotes/origin/main "$BASE_SHA"
          git switch -c fix-uninstall-docker-recovery-11438
          git config user.name 'Sylvester Kaczmarek'
          git config user.email '16242628+sylvesterkaczmarek@users.noreply.github.com'
          npm ci --ignore-scripts 2>&1 | tee ../artifacts/setup.log
          npm --prefix nemoclaw ci --ignore-scripts 2>&1 | tee -a ../artifacts/setup.log
          node_modules/.bin/prek install
          npm run build:cli 2>&1 | tee ../artifacts/baseline-build.log
          git diff --exit-code
      - name: Prove the regression tests fail before the change
        run: |
          cd NemoClaw
          git apply --include='*test.ts' ../helper/secondary/NemoClaw-11438.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/actions/uninstall/run-plan-gateway-segregation.test.ts')
          text = p.read_text()
          old = '    if (dockerInstalled) {\n      expect(runDocker).toHaveBeenCalledWith(["info"]'
          assert text.count(old) == 1
          p.write_text(text.replace(old, '    if (dockerInstalled && removeStatus !== 0) {\n      expect(runDocker).toHaveBeenCalledWith(["info"]'))
          PY
          set +e
          node_modules/.bin/vitest run --project cli src/lib/actions/uninstall/run-plan-gateway-segregation.test.ts -t '#11438' --reporter=default --reporter=junit --outputFile.junit=../artifacts/baseline.xml > ../artifacts/baseline.log 2>&1
          status=$?
          set -e
          cat ../artifacts/baseline.log
          test "$status" = 1
          python3 - <<'PY'
          from xml.etree import ElementTree as ET
          root = ET.parse('../artifacts/baseline.xml').getroot()
          assert not list(root.iter('error'))
          assert len(list(root.iter('failure'))) >= 3
          PY
      - name: Apply and format the production change
        run: |
          cd NemoClaw
          git apply --exclude='*test.ts' ../helper/secondary/NemoClaw-11438.patch
          node_modules/.bin/oxfmt src/lib/actions/uninstall/run-plan.ts src/lib/actions/uninstall/run-plan-gateway-segregation.test.ts
          git diff --check
      - name: Run uninstall and gateway removal tests
        run: |
          set -o pipefail
          cd NemoClaw
          node_modules/.bin/vitest run --project cli src/lib/actions/uninstall/ src/lib/onboard/gateway-teardown-authority.test.ts src/lib/uninstall-command.test.ts --reporter=default --reporter=junit --outputFile.junit=../artifacts/tests.xml 2>&1 | tee ../artifacts/tests.log
      - name: Build and type-check
        run: |
          set -euo pipefail
          cd NemoClaw
          npm run build:cli 2>&1 | tee ../artifacts/build.log
          npm --prefix nemoclaw run build 2>&1 | tee -a ../artifacts/build.log
          npm run typecheck:cli 2>&1 | tee ../artifacts/typecheck.log
      - name: Check the trusted base and run repository validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd NemoClaw
          observed=$(gh api repos/NVIDIA/NemoClaw/git/ref/heads/main --jq '.object.sha')
          printf 'Canonical base: %s\n' "$observed"
          test "$observed" = "$BASE_SHA"
          git fetch -q --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git diff --name-only | wc -l)" = 2
          git diff --exit-code origin/main -- package.json package-lock.json .pre-commit-config.yaml commitlint.config.js scripts tools test/helpers
          git add src/lib/actions/uninstall/run-plan.ts src/lib/actions/uninstall/run-plan-gateway-segregation.test.ts
          git commit -s -m 'fix(uninstall): report Docker recovery before retaining state' 2>&1 | tee ../artifacts/commit.log
          npm run validate:pr 2>&1 | tee ../artifacts/validate-pr.log
          test -z "$(git status --porcelain)"
      - name: Export the candidate and results
        if: always()
        run: |
          if test -d NemoClaw/.git; then
            cd NemoClaw
            git diff "$BASE_SHA" > ../artifacts/NemoClaw-11438.patch
            git diff "$BASE_SHA" --stat > ../artifacts/diff-stat.txt
            git rev-parse HEAD > ../artifacts/tested-commit.txt
            cp src/lib/actions/uninstall/run-plan.ts ../artifacts/run-plan.ts
            cp src/lib/actions/uninstall/run-plan-gateway-segregation.test.ts ../artifacts/run-plan-gateway-segregation.test.ts
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validated-uninstall-docker-recovery-11438
          path: artifacts/
          retention-days: 7
